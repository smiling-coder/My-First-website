<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infosys Career Cracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1FA;--s1:#FFFFFF;--s2:#F3F6FD;--tx:#0F1733;--mu:#5A6690;--ln:rgba(15,23,51,.12);--ln2:rgba(15,23,51,.07);--az:#1F6FE5;--sf:#D98E00;--mt:#0E9F77;--co:#E0434B;--vi:#6D4AE8;--g1:rgba(31,111,229,.16);--g2:rgba(217,142,0,.12);--g3:rgba(109,74,232,.12);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1127;--s1:#141B38;--s2:#1B2447;--tx:#E9EDFA;--mu:#8D99C2;--ln:rgba(255,255,255,.12);--ln2:rgba(255,255,255,.07);--az:#4C93FF;--sf:#FFB52E;--mt:#35D6A4;--co:#FF6F7D;--vi:#9B7BFF;--g1:rgba(76,147,255,.2);--g2:rgba(255,181,46,.1);--g3:rgba(155,123,255,.16);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1127;--s1:#141B38;--s2:#1B2447;--tx:#E9EDFA;--mu:#8D99C2;--ln:rgba(255,255,255,.12);--ln2:rgba(255,255,255,.07);--az:#4C93FF;--sf:#FFB52E;--mt:#35D6A4;--co:#FF6F7D;--vi:#9B7BFF;--g1:rgba(76,147,255,.2);--g2:rgba(255,181,46,.1);--g3:rgba(155,123,255,.16);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:500 15px/1.55 'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
background-image:radial-gradient(900px 500px at 8% -5%,var(--g1),transparent 60%),radial-gradient(700px 500px at 100% 10%,var(--g3),transparent 60%),radial-gradient(800px 600px at 60% 110%,var(--g2),transparent 60%),radial-gradient(var(--ln2) 1px,transparent 1px);background-size:auto,auto,auto,24px 24px;background-attachment:fixed}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em;margin:0;line-height:1.1}
h2{font-size:26px}h3{font-size:17px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--az);outline-offset:2px;border-radius:8px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);max-width:1380px;margin:0 auto}
.nav{position:sticky;top:0;align-self:start;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--ln2)}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.logo{width:38px;height:38px;border-radius:12px 12px 12px 4px;background:linear-gradient(135deg,var(--az),var(--vi));display:grid;place-items:center;color:#fff;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;font-size:18px}
.brand b{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;line-height:1.05;display:block}.brand small{color:var(--mu);font-size:12px}
.nb{display:flex;gap:11px;align-items:center;border:0;background:none;padding:10px 12px;border-radius:12px;color:var(--mu);font-weight:600;text-align:left;white-space:nowrap}
.nb span.i{font-size:17px;width:22px;text-align:center}
.nb:hover{background:var(--s2);color:var(--tx)}
.nb[aria-current="page"]{background:var(--s1);color:var(--tx);box-shadow:inset 3px 0 0 var(--az),0 0 0 1px var(--ln2)}
.navfoot{margin-top:auto;display:flex;gap:8px;padding:8px}
main{padding:22px clamp(14px,3vw,34px) 60px;min-width:0}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.top p{margin:4px 0 0;color:var(--mu)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;background:var(--s1);border:1px solid var(--ln);font-weight:600;font-size:13px}
.btn{border:1px solid var(--ln);background:var(--s1);padding:9px 16px;border-radius:12px;font-weight:700}
.btn:hover{border-color:var(--az)}
.btn.p{background:var(--az);border-color:var(--az);color:#fff}
.btn.g{background:var(--mt);border-color:var(--mt);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:18px;position:relative;min-width:0}
.card.w2{grid-column:span 2}.card.w3{grid-column:1/-1}
@media(max-width:700px){.card.w2{grid-column:1/-1}.grid{grid-template-columns:1fr}.shell{display:block}
.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--s1);border-top:1px solid var(--ln);border-right:0;gap:2px}
.brand,.navfoot{display:none}.nb{flex-direction:column;gap:0;padding:6px 12px;font-size:11px}main{padding-bottom:110px}}
.card.hero{border-radius:30px 30px 30px 8px;background:linear-gradient(150deg,var(--s1),var(--s2));overflow:hidden}
.card.drag{z-index:30;transform:scale(1.02) rotate(-.6deg);box-shadow:0 24px 50px rgba(0,0,0,.28);border-color:var(--az);cursor:grabbing}
.grip{position:absolute;right:10px;top:10px;border:0;background:none;color:var(--mu);width:30px;height:30px;border-radius:8px;touch-action:none;cursor:grab;font-size:16px;letter-spacing:-2px}
.grip:hover{background:var(--s2);color:var(--tx)}
.card h3{padding-right:30px;margin-bottom:10px}
.mu{color:var(--mu)}.sm{font-size:13px}.big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.04em}
.bar{height:8px;border-radius:99px;background:var(--ln2);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--az);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.sk{display:grid;grid-template-columns:104px 1fr 40px;gap:10px;align-items:center;margin:9px 0;font-size:14px}.sk b{text-align:right;font-variant-numeric:tabular-nums}
.ringwrap{display:grid;grid-template-columns:minmax(210px,300px) 1fr;gap:20px;align-items:center}
@media(max-width:700px){.ringwrap{grid-template-columns:1fr}}
.ring{width:100%;max-width:300px;margin:auto;display:block}
.seg{fill:none;stroke-width:15;stroke-linecap:round}
.seg.f{transition:stroke-dasharray 1.4s cubic-bezier(.2,.8,.2,1)}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.leg div{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600}.leg i{width:10px;height:10px;border-radius:3px;flex:none}.leg b{margin-left:auto;font-variant-numeric:tabular-nums}
.verdict{border-left:4px solid var(--sf);padding:10px 14px;background:var(--s2);border-radius:4px 12px 12px 4px;margin:8px 0;font-size:14px}
.verdict.bad{border-color:var(--co)}.verdict.ok{border-color:var(--mt)}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:14px;border:1px solid var(--ln);border-radius:16px;margin-bottom:10px;background:var(--s1);align-items:start}
.task.done{opacity:.62}.task h4{margin:0;font-size:15px}.task p{margin:3px 0 0;font-size:13.5px;color:var(--mu)}
.st{border:1px solid var(--ln);background:var(--s2);border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px;min-width:104px}
.st[data-s="1"]{background:var(--g2);border-color:var(--sf);color:var(--sf)}.st[data-s="2"]{background:var(--mt);border-color:var(--mt);color:#fff}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--s2);border:1px solid var(--ln2);color:var(--mu)}
.tag.f{background:var(--g2);color:var(--sf);border-color:var(--sf)}
textarea,input[type=text],input[type=number],select,input[type=email],input[type=tel]{width:100%;background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
textarea{resize:vertical;min-height:90px}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;min-height:210px;tab-size:2;white-space:pre}
pre{background:var(--s2);border:1px solid var(--ln2);border-radius:12px;padding:12px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:8px 0}
label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--ln);background:var(--s1);padding:8px 15px;border-radius:99px;font-weight:700;font-size:14px}.tab[aria-selected="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.pick{text-align:left;border:1px solid var(--ln);background:var(--s1);border-radius:18px;padding:16px;display:block;width:100%}.pick:hover{border-color:var(--az)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--s1)}
.opt:hover{border-color:var(--az)}.opt.sel{border-color:var(--az);background:var(--g1)}.opt.ok{border-color:var(--mt);background:var(--mt);color:#fff}.opt.no{border-color:var(--co);background:var(--co);color:#fff}
.res{padding:8px 12px;border-radius:10px;margin:6px 0;font-size:13.5px;font-family:ui-monospace,Menlo,monospace}.res.ok{background:rgba(14,159,119,.15)}.res.no{background:rgba(224,67,75,.15)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto;padding:4px}
.msg{max-width:86%;padding:11px 15px;border-radius:18px;white-space:pre-wrap}.msg.u{align-self:flex-end;background:var(--az);color:#fff;border-bottom-right-radius:5px}.msg.a{background:var(--s2);border:1px solid var(--ln2);border-bottom-left-radius:5px}
details{border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:8px 0;background:var(--s1)}summary{cursor:pointer;font-weight:700}
.tl{position:relative;padding-left:26px}.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--ln)}
.tl .n{position:relative;padding:8px 0}.tl .n:before{content:"";position:absolute;left:-23px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--s1);border:2px solid var(--ln)}
.tl .n.done:before{background:var(--mt);border-color:var(--mt)}.tl .n.cur:before{border-color:var(--az);background:var(--az);box-shadow:0 0 0 5px var(--g1)}.tl .n.lock{opacity:.55}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--ln);border-radius:16px;background:var(--s1)}.badge.off{opacity:.45;filter:grayscale(1)}.badge .e{font-size:26px;width:46px;height:46px;border-radius:14px;background:var(--s2);display:grid;place-items:center}
.gap{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:50;font-weight:700;max-width:90vw;text-align:center}
.onb{max-width:760px;margin:0 auto;padding:30px 16px 60px}
.note{font-size:12.5px;color:var(--mu);border:1px dashed var(--ln);border-radius:12px;padding:10px 12px;margin-top:12px}
.meter{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px;margin:6px 0}.kv b{color:var(--mu);font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dkey();
const LS='icc_v1';
let S,memStore=null;
const def=()=>({profile:null,xp:{coding:0,knowledge:0,project:0,interview:0},days:{},mins:{},missions:{},base:{},solved:{},drafts:{},apt:{},aptLog:[],aptTests:0,topics:{},projects:{},gh:{checks:{},inputs:{repos:0,commits:0,readme:0,projs:0}},port:{},resume:{data:{},ats:0,saved:false},iv:[],sessions:0,eng:[],quality:{},defense:0,order:null,theme:null,join:today(),weekly:[]});
function load(){try{const r=localStorage.getItem(LS);S=r?Object.assign(def(),JSON.parse(r)):def()}catch(e){S=memStore||def()}memStore=S}
function save(){memStore=S;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}

/* ============ data ============ */
const SKILLS=[['coding','Coding','#3D8BFF'],['aptitude','Aptitude','#FFB52E'],['technical','Technical','#9B7BFF'],['sqldbms','SQL / DBMS','#4FD1E8'],['projects','Projects','#35D6A4'],['github','GitHub','#FF8FA3'],['resume','Resume','#E6CF5A'],['communication','Communication','#FF7A59'],['interview','Interview','#B6E35A']];
const W={coding:.17,aptitude:.13,technical:.14,sqldbms:.08,projects:.13,github:.07,resume:.08,communication:.08,interview:.12};
const TOPICS=[
{id:'prog',n:'Programming fundamentals',c:'tech',tip:'Variables, conditions, loops, functions. Write 5 programs without looking.'},
{id:'py',n:'Python',c:'tech',tip:'Lists, dicts, functions, file handling, OOP basics.'},
{id:'cs',n:'C#',c:'tech',tip:'Syntax, classes, collections, exceptions, LINQ basics.'},
{id:'dsa',n:'Data structures',c:'tech',tip:'Arrays, stacks, queues, linked lists, trees, hashing.'},
{id:'oop',n:'OOP',c:'tech',tip:'Encapsulation, inheritance, polymorphism, abstraction with your own examples.'},
{id:'dbms',n:'DBMS',c:'sql',tip:'Keys, normalization, ACID, transactions, ER diagrams.'},
{id:'sql',n:'SQL',c:'sql',tip:'SELECT, WHERE, GROUP BY, HAVING, JOINs, subqueries.'},
{id:'os',n:'Operating Systems',c:'tech',tip:'Processes, threads, scheduling, deadlock, memory management.'},
{id:'cn',n:'Computer Networks',c:'tech',tip:'OSI/TCP-IP, TCP vs UDP, DNS, HTTP, IP addressing.'},
{id:'se',n:'Software Engineering',c:'tech',tip:'SDLC, Agile, testing types, version control.'},
{id:'html',n:'HTML',c:'tech',tip:'Semantic tags, forms, tables, accessibility basics.'},
{id:'css',n:'CSS',c:'tech',tip:'Box model, flexbox, grid, responsive media queries.'},
{id:'js',n:'JavaScript',c:'tech',tip:'DOM, events, async/await, fetch, array methods.'},
{id:'git',n:'Git',c:'git',tip:'init, add, commit, branch, merge, log.'},
{id:'gh',n:'GitHub',c:'git',tip:'Repos, push/pull, pull requests, issues, README.'}];
const PROBS=[
{id:'sum',lvl:'Beginner',topic:'Arrays',title:'Sum of an array',desc:'Return the sum of all numbers in the array.',concept:'A loop visits each item once while a running total grows.',ex:'[2,4] → 6',starter:'function solve(arr){\n  \n}',tests:[[[[1,2,3]],6],[[[]],0],[[[-5,5,10]],10]],hint:'Start a variable at 0 and add each element inside a loop.',sol:'function solve(arr){\n  let t=0;\n  for(const x of arr) t+=x;\n  return t;\n}',time:'O(n)',space:'O(1)',rel:'Loops, accumulators, reduce()'},
{id:'rev',lvl:'Beginner',topic:'Strings',title:'Reverse a string',desc:'Return the string reversed.',concept:'Strings are sequences; read them from the last index to the first.',ex:'"abc" → "cba"',starter:'function solve(s){\n  \n}',tests:[[['abc'],'cba'],[[''],''],[['Infosys'],'sysofnI']],hint:'Loop from s.length-1 down to 0 and build a new string.',sol:'function solve(s){\n  let r="";\n  for(let i=s.length-1;i>=0;i--) r+=s[i];\n  return r;\n}',time:'O(n)',space:'O(n)',rel:'Indexing, string building, two pointers'},
{id:'max',lvl:'Easy',topic:'Arrays',title:'Largest number',desc:'Return the largest number in a non-empty array without Math.max.',concept:'Track the best value seen so far and compare each item to it.',ex:'[3,9,2] → 9',starter:'function solve(arr){\n  \n}',tests:[[[[3,9,2]],9],[[[-4,-1,-8]],-1],[[[7]],7]],hint:'Start with the first element, not with 0 (negatives!).',sol:'function solve(arr){\n  let m=arr[0];\n  for(const x of arr) if(x>m) m=x;\n  return m;\n}',time:'O(n)',space:'O(1)',rel:'Linear scan, edge cases with negatives',ban:['Math.max']},
{id:'pal',lvl:'Easy',topic:'Strings',title:'Palindrome check',desc:'Return true if the string reads the same both ways, ignoring case.',concept:'Compare characters from both ends moving inward.',ex:'"Level" → true',starter:'function solve(s){\n  \n}',tests:[[['madam'],true],[['hello'],false],[['Level'],true],[[''],true]],hint:'Lowercase first, then compare s[i] with s[n-1-i].',sol:'function solve(s){\n  s=s.toLowerCase();\n  for(let i=0,j=s.length-1;i<j;i++,j--) if(s[i]!==s[j]) return false;\n  return true;\n}',time:'O(n)',space:'O(1)',rel:'Two pointers, normalization'},
{id:'vow',lvl:'Easy',topic:'Strings',title:'Count vowels',desc:'Count the vowels (a,e,i,o,u, any case) in a string.',concept:'Check each character against a small set of allowed values.',ex:'"Infosys" → 2',starter:'function solve(s){\n  \n}',tests:[[['Infosys'],2],[['rhythm'],0],[['AEIOU'],5]],hint:'Use "aeiou".includes(ch.toLowerCase()).',sol:'function solve(s){\n  let c=0;\n  for(const ch of s.toLowerCase()) if("aeiou".includes(ch)) c++;\n  return c;\n}',time:'O(n)',space:'O(1)',rel:'Sets, character checks'},
{id:'fact',lvl:'Easy',topic:'Recursion',title:'Factorial (recursion)',desc:'Return n! using recursion. 0! = 1.',concept:'A recursive function needs a base case and a smaller sub-problem.',ex:'5 → 120',starter:'function solve(n){\n  \n}',tests:[[[5],120],[[0],1],[[7],5040]],hint:'Base case: n<=1 returns 1. Otherwise n * solve(n-1).',sol:'function solve(n){\n  if(n<=1) return 1;\n  return n*solve(n-1);\n}',time:'O(n)',space:'O(n) call stack',rel:'Base case, call stack, iteration vs recursion'},
{id:'pat',lvl:'Easy',topic:'Patterns',title:'Star staircase',desc:'Return an array of n strings forming a right-angle star pattern.',concept:'Nested loops: the outer loop is the row, the inner loop is the column.',ex:'3 → ["*","**","***"]',starter:'function solve(n){\n  \n}',tests:[[[3],['*','**','***']],[[1],['*']],[[4],['*','**','***','****']]],hint:'Row i (1-based) has i stars. Try "*".repeat(i).',sol:'function solve(n){\n  const out=[];\n  for(let i=1;i<=n;i++) out.push("*".repeat(i));\n  return out;\n}',time:'O(n²)',space:'O(n²)',rel:'Nested loops, string repeat'},
{id:'two',lvl:'Medium',topic:'Arrays',title:'Two Sum',desc:'Given arr and target, return the indices [i,j] (i<j) of two numbers adding to target.',concept:'Remember what you have seen in a map so each lookup is instant.',ex:'([2,7,11,15],9) → [0,1]',starter:'function solve(arr,target){\n  \n}',tests:[[[[2,7,11,15],9],[0,1]],[[[3,2,4],6],[1,2]],[[[3,3],6],[0,1]]],hint:'For each x, ask: have I already seen target-x? Store value→index.',sol:'function solve(arr,target){\n  const seen=new Map();\n  for(let i=0;i<arr.length;i++){\n    const need=target-arr[i];\n    if(seen.has(need)) return [seen.get(need),i];\n    seen.set(arr[i],i);\n  }\n  return [];\n}',time:'O(n)',space:'O(n)',rel:'Hashing, brute force vs optimised'},
{id:'ana',lvl:'Medium',topic:'Strings',title:'Anagram check',desc:'Return true if two strings use the same letters (ignore case).',concept:'Two words are anagrams when their letter counts match.',ex:'("listen","silent") → true',starter:'function solve(a,b){\n  \n}',tests:[[['listen','silent'],true],[['abc','abd'],false],[['Ab','ba'],true],[['aa','a'],false]],hint:'Count letters of the first word, then subtract using the second.',sol:'function solve(a,b){\n  if(a.length!==b.length) return false;\n  const m={};\n  for(const c of a.toLowerCase()) m[c]=(m[c]||0)+1;\n  for(const c of b.toLowerCase()){ if(!m[c]) return false; m[c]--; }\n  return true;\n}',time:'O(n)',space:'O(k)',rel:'Frequency maps, sorting alternative'},
{id:'bin',lvl:'Medium',topic:'Searching',title:'Binary search',desc:'Return the index of target in a sorted array, or -1.',concept:'Halve the search range each step by comparing with the middle.',ex:'([1,3,5,7,9],7) → 3',starter:'function solve(arr,target){\n  \n}',tests:[[[[1,3,5,7,9],7],3],[[[1,3,5],4],-1],[[[],1],-1],[[[2],2],0]],hint:'Keep lo and hi. mid=Math.floor((lo+hi)/2). Move lo or hi past mid.',sol:'function solve(arr,target){\n  let lo=0,hi=arr.length-1;\n  while(lo<=hi){\n    const mid=Math.floor((lo+hi)/2);\n    if(arr[mid]===target) return mid;\n    if(arr[mid]<target) lo=mid+1; else hi=mid-1;\n  }\n  return -1;\n}',time:'O(log n)',space:'O(1)',rel:'Divide and conquer, sorted data'},
{id:'dup',lvl:'Medium',topic:'Lists',title:'Remove duplicates',desc:'Return a new array without duplicates, keeping first-seen order.',concept:'A Set remembers what you have already added.',ex:'[1,2,2,3,1] → [1,2,3]',starter:'function solve(arr){\n  \n}',tests:[[[[1,2,2,3,1]],[1,2,3]],[[[]],[]],[[[5,5,5]],[5]]],hint:'Loop once; push only if the Set does not have the value yet.',sol:'function solve(arr){\n  const s=new Set(),out=[];\n  for(const x of arr) if(!s.has(x)){ s.add(x); out.push(x); }\n  return out;\n}',time:'O(n)',space:'O(n)',rel:'Sets, order preservation'},
{id:'srt',lvl:'Medium',topic:'Sorting',title:'Sort without .sort()',desc:'Return the array sorted ascending. Using .sort() is not allowed.',concept:'Bubble sort repeatedly swaps neighbours that are out of order.',ex:'[5,2,9,1] → [1,2,5,9]',starter:'function solve(arr){\n  \n}',tests:[[[[5,2,9,1]],[1,2,5,9]],[[[]],[]],[[[3,3,1]],[1,3,3]]],hint:'Two loops: compare arr[j] with arr[j+1] and swap when needed.',sol:'function solve(arr){\n  const a=[...arr];\n  for(let i=0;i<a.length;i++)\n    for(let j=0;j<a.length-i-1;j++)\n      if(a[j]>a[j+1]) [a[j],a[j+1]]=[a[j+1],a[j]];\n  return a;\n}',time:'O(n²)',space:'O(n)',rel:'Bubble/selection/insertion sort, merge sort next',ban:['.sort(']},
{id:'fib',lvl:'Medium',topic:'Recursion',title:'Fibonacci',desc:'Return the nth Fibonacci number (fib(0)=0, fib(1)=1). Must handle n=30 quickly.',concept:'Plain recursion repeats work; remember results (memoization) or loop.',ex:'10 → 55',starter:'function solve(n){\n  \n}',tests:[[[0],0],[[1],1],[[10],55],[[30],832040]],hint:'Keep two variables a,b and move them forward n times.',sol:'function solve(n){\n  let a=0,b=1;\n  for(let i=0;i<n;i++) [a,b]=[b,a+b];\n  return a;\n}',time:'O(n)',space:'O(1)',rel:'Memoization, dynamic programming'},
{id:'par',lvl:'Advanced',topic:'Stacks',title:'Valid parentheses',desc:'Return true if every bracket ()[]{} is closed in the correct order.',concept:'A stack remembers the most recent opener that still needs a match.',ex:'"([)]" → false',starter:'function solve(s){\n  \n}',tests:[[['()[]{}'],true],[['(]'],false],[['([)]'],false],[[''],true],[['{[]}'],true]],hint:'Push openers. On a closer, the top of the stack must be its pair.',sol:'function solve(s){\n  const st=[],pair={")":"(","]":"[","}":"{"};\n  for(const c of s){\n    if("([{".includes(c)) st.push(c);\n    else if(st.pop()!==pair[c]) return false;\n  }\n  return st.length===0;\n}',time:'O(n)',space:'O(n)',rel:'Stack, parsing, compilers'},
{id:'lss',lvl:'Advanced',topic:'Strings',title:'Longest unique substring',desc:'Return the length of the longest substring with no repeated characters.',concept:'A sliding window grows on the right and shrinks on the left when a repeat appears.',ex:'"abcabcbb" → 3',starter:'function solve(s){\n  \n}',tests:[[['abcabcbb'],3],[['bbbbb'],1],[['pwwkew'],3],[[''],0]],hint:'Store each character\'s last index; jump the left edge past a repeat.',sol:'function solve(s){\n  const last=new Map();let l=0,best=0;\n  for(let r=0;r<s.length;r++){\n    if(last.has(s[r])&&last.get(s[r])>=l) l=last.get(s[r])+1;\n    last.set(s[r],r);\n    best=Math.max(best,r-l+1);\n  }\n  return best;\n}',time:'O(n)',space:'O(k)',rel:'Sliding window, hashing'}];

const gcd=(a,b)=>b?gcd(b,a%b):a;
function num(topic,q,c,exp,fmt=x=>x,sp){const set=new Set([c]);let n=0;while(set.size<4&&n++<80){const d=pick([-3,-2,-1,1,2,3,4,-4])*(sp||Math.max(1,Math.round(Math.abs(c)*.1)));const v=+(c+d).toFixed(2);if(v>0||c<=0)set.add(v)}const o=shuffle([...set]);return{topic,q,opts:o.map(fmt),ans:o.indexOf(c),exp}}

function buildTest(kind){let pool=[];const n=10;
 if(kind==='Quant')for(let i=0;i<n;i++)pool.push(GEN[pick(QUANT)]());
 else if(kind==='Logical')pool=shuffle(LOGI).map(stat).slice(0,8);

const topicDone=c=>TOPICS.filter(t=>c.includes(t.c)&&S.topics[t.id]).length/TOPICS.filter(t=>c.includes(t.c)).length;

function ghScore(){const c=Object.values(S.gh.checks).filter(Boolean).length/GH_TASKS.length,i=S.gh.inputs;return Math.round(100*(.5*c+.2*Math.min(1,i.repos/5)+.2*Math.min(1,i.commits/50)+.1*Math.min(1,i.projs/3)))}
function mDone(){return PROJECTS.reduce((s,p)=>s+(S.projects[p.id]?.done||0),0)}
function scores(){
 const sol=Object.keys(S.solved).length;let c=0,t=0;for(const k in S.apt){c+=S.apt[k].c;t+=S.apt[k].t}
 const techIv=f=>S.iv.filter(x=>x.kind==='tech'&&f(x));
 const sqlIv=techIv(x=>['SQL','DBMS'].includes(x.topic)),othIv=techIv(x=>!['SQL','DBMS'].includes(x.topic));
 const q=Object.values(S.quality).map(x=>x.score);
 const o={coding:Math.round(sol/PROBS.length*100),
 aptitude:t?Math.round(c/t*100*Math.min(1,t/60)):0,
 technical:Math.round(50*topicDone(['tech'])+.5*avg(othIv.map(x=>x.score))*Math.min(1,othIv.length/8)),
 sqldbms:Math.round(50*topicDone(['sql'])+.5*avg(sqlIv.map(x=>x.score))*Math.min(1,sqlIv.length/3)),
 projects:Math.round(clamp(mDone()/21*70+(S.defense>0?10:0)+avg(q)*.2)),
 github:ghScore(),resume:S.resume.saved?Math.round(S.resume.ats):0,
 communication:Math.round(avg(S.eng.map(x=>x.score))*Math.min(1,S.eng.length/6)),
 interview:Math.round(ivAvg(x=>x.kind!=='tech'||true)*Math.min(1,S.iv.length/10))};
 for(const k in o)o[k]=clamp(o[k]);
 o.overall=Math.round(SKILLS.reduce((s,[k])=>s+o[k]*W[k],0));return o}
function prior(){const p=S.profile||{},m={None:5,Basic:25,Intermediate:50,Advanced:70};return{coding:m[p.prog]||10,aptitude:{Low:15,Medium:40,High:65}[p.apt]||20,technical:m[p.prog]||10,sqldbms:m[p.db]||10,projects:Math.min(40,(p.curProj||'').length>3?30:5),github:m[p.git]||10,resume:0,communication:(+p.eng||2)*15,interview:0}}
function weakOrder(){const sc=scores(),pr=prior();return SKILLS.map(s=>s[0]).sort((a,b)=>(sc[a]+pr[a]*.2)-(sc[b]+pr[b]*.2))}
const NAME=Object.fromEntries(SKILLS.map(s=>[s[0],s[1]]));
function tier(o){return o<20?'Just starting':o<40?'Building foundations':o<60?'Getting stronger':o<80?'Interview-capable':'Strong candidate'}

 if(sc.github<50)v.push(['bad','Your GitHub portfolio needs improvement.','Create python-practice, add a README, and make 5 meaningful commits this week.']);
 if(sc.projects<50)v.push(['bad','Your projects demonstrate fundamentals but are not yet strong enough to differentiate your profile.','Finish one Level 1 project completely, then start a Level 2 project with a database and login.']);
 if(sc.coding<50)v.push(['bad','Focus on arrays, strings and problem-solving before increasing project complexity.','Solve one problem a day. Attempt first, hints only when stuck.']);
 if(sc.aptitude<50)v.push(['',"Your aptitude accuracy or volume is low.",'Do a 10-question timed test daily; review every wrong answer.']);
 if(sc.sqldbms<50)v.push(['',"SQL and DBMS are a likely screening topic and are still weak.",'Practise JOINs, GROUP BY and normalization, then explain them aloud.']);
 if(sc.communication<50)v.push(['',"Communication practice is thin.",'Do the 5-minute speaking task every day and record yourself.']);
 if(sc.interview<50)v.push(['',"You have not practised enough mock interviews.",'Complete one 5-question mock session after each study week.']);
 if(sc.resume<60)v.push(['',"Your resume is not yet ATS-ready.",'Fill every section truthfully and aim for an ATS score above 75.']);
 return v}

 const w=weakOrder(),sc=scores(),p=S.profile,day=Math.floor((new Date(k)-new Date(S.join))/864e5)+1,hrs=+p.hours||2;
 if(!S.base[k])S.base[k]=sc.overall;

function runProb(){const p=PROBS.find(x=>x.id===CP),code=$('#code').value;S.drafts[p.id]=code;CP_STATE.tries++;const out=$('#out');
 const ban=(p.ban||[]).find(b=>code.includes(b));if(ban){out.innerHTML=`<div class="verdict bad">The built-in <code>${esc(ban)}</code> is not allowed here. Write the logic yourself.</div>`;return}
 let fn;try{fn=new Function(code+'\n;return typeof solve==="function"?solve:null;')()}catch(e){if(e.name==='EvalError'){out.innerHTML=`<div class="verdict">This environment blocks running code. Check your solution by hand against the test cases, explain it below, and mark it solved when you are confident.</div><button class="btn g" data-a="manualSolve">I checked it by hand</button>`;$('[data-a=solProb]').disabled=false;return}out.innerHTML=`<div class="verdict bad"><b>Error:</b> ${esc(e.message)}</div>`;return}
 if(!fn){out.innerHTML='<div class="verdict bad">Define a function named <code>solve</code>.</div>';return}
 const rs=p.tests.map(([a,e])=>{try{const o=fn(...JSON.parse(JSON.stringify(a)));return{ok:JSON.stringify(o)===JSON.stringify(e),o,e,a}}catch(x){return{ok:false,o:'Error: '+x.message,e,a}}});
 const pass=rs.every(r=>r.ok);S.attempts=S.attempts||[];S.attempts.push({id:p.id,pass,t:Date.now()});
 out.innerHTML=`<h3 style="margin-top:14px">${pass?'✅ Correct':'❌ Not yet'} (${rs.filter(r=>r.ok).length}/${rs.length} tests)</h3>${rs.map(r=>`<div class="res ${r.ok?'ok':'no'}">${r.ok?'PASS':'FAIL'} · solve(${esc(r.a.map(x=>JSON.stringify(x)).join(', '))}) → got ${esc(JSON.stringify(r.o))}, expected ${esc(JSON.stringify(r.e))}</div>`).join('')}${pass?finishProb(p):''}`;
 $('[data-a=solProb]').disabled=false;save()}

function atsScore(d){const txt=((d.summary||'')+' '+(d.skills||'')+' '+(d.projects||'')).toLowerCase(),v=VERS[d.version||'Infosys Fresher'],items=[];
 const add=(ok,pts,m)=>items.push({ok,pts,m});const sw=(d.summary||'').trim().split(/\s+/).filter(Boolean).length;const pl=(d.projects||'').split('\n').filter(x=>x.trim());
 add(!!(d.email&&d.phone),10,'Add email and phone');add(sw>=25&&sw<=70,10,'Summary should be 25-70 words');add(!!(d.degree&&d.college),10,'Complete the education section');
 add((d.skills||'').split(',').filter(x=>x.trim()).length>=6,10,'List at least 6 skills you can explain');add(pl.length>=2,15,'Add at least 2 real projects');
 add(pl.some(x=>/python|java|c#|sql|html|css|javascript|react|node|flask|asp/i.test(x)),10,'Name the technologies in each project');add(/\d/.test(d.projects||''),10,'Add real numbers (users, records, pages, tests)');
 add(!!d.github,8,'Add your GitHub link');add(!!d.linkedin,7,'Add your LinkedIn link');
 const hit=v.kw.filter(k=>k.split('|').some(a=>txt.includes(a)));add(hit.length>=Math.ceil(v.kw.length*.6),10,`Cover more ${d.version||'Infosys Fresher'} keywords: ${v.kw.filter(k=>!hit.includes(k)).map(k=>k.split('|')[0]).join(', ')}`);
 add(!/\b(i am|i have|my)\b/i.test(d.projects||''),0,'Avoid first-person in bullets');
 let s=items.reduce((a,x)=>a+(x.ok?x.pts:0),0);if(!d.attest)s=Math.min(s,40);return{score:s,items}}

function review(t){const low=t.toLowerCase(),w=t.trim().split(/\s+/).filter(Boolean).length,sec=['education','skills','project','summary|objective','certif','github|linkedin'].map(s=>[s,s.split('|').some(x=>low.includes(x))]);
 const weak=['responsible for','hard working','hardworking','team player','worked on','good communication','passionate','results-oriented'].filter(x=>low.includes(x)),nums=(t.match(/\d+/g)||[]).length;

 const gram=[/\s{2,}/.test(t)?'Double spaces found':'',/(^|[.!?]\s+)[a-z]/.test(t)?'Some sentences start in lowercase':'',/\bi\b(?![\w'])/.test(t)?'Lowercase "i" found':''].filter(Boolean);
 let s=0;sec.forEach(x=>{if(x[1])s+=10});s+=Math.min(20,nums*3)+(w>=150&&w<=600?15:0)+(weak.length?0:5);s=Math.min(100,s);
 return `<h3 style="margin-top:16px">Review score: ${s}/100</h3><div class="two"><div class="verdict ${w>=150&&w<=600?'ok':'bad'}">Length: ${w} words (aim for 150-600)</div><div class="verdict ${nums>=4?'ok':'bad'}">Numbers found: ${nums}. ${nums<4?'Add real, truthful numbers (users, records, tests, pages).':''}</div></div>${sec.filter(x=>!x[1]).map(x=>`<div class="verdict bad sm">Missing section or keyword: ${x[0].split('|')[0]}</div>`).join('')}${weak.length?`<div class="verdict bad"><b>Weak phrases:</b> ${weak.join(', ')}. Replace with action verbs: built, designed, implemented, tested.</div>`:''}${gram.length?`<div class="verdict bad">Grammar/format: ${gram.join('; ')}</div>`:''}<h3 style="margin-top:12px">Missing keywords by version</h3>${kw.map(([n,m])=>`<div class="verdict sm"><b>${n}:</b> ${m.length?m.join(', '):'covered'}</div>`).join('')}<h3 style="margin-top:12px">Rewrite helper from your own projects</h3>${(S.resume.data.projects||'').split('\n').filter(x=>x.trim()).map(x=>`<div class="verdict sm">Your line: ${esc(x)}<br><b>Template:</b> Built [what] using [tech] to [purpose]; implemented [feature]; tested with [N cases]. Use only facts that are true.</div>`).join('')||'<p class="mu sm">Add projects in the builder to get line-by-line rewrite templates.</p>'}`}

/* ----- interview engine ----- */
function evalAns(it,text){const w=text.trim().split(/\s+/).filter(Boolean),n=w.length,low=text.toLowerCase();let rel,miss=[];
 if(it.k&&it.k.length){const hit=it.k.filter(k=>k.split('|').some(a=>low.includes(a)));miss=it.k.filter(k=>!hit.includes(k));rel=hit.length/it.k.length}else{const tech=(it.terms||[]).filter(x=>low.includes(x)).length;rel=clamp(n/60,0,1)*.6+(tech>0?.4:0)+0}
 const sen=text.split(/[.!?]+/).filter(x=>x.trim()).length,hedge=(low.match(/maybe|i think|not sure|\bum\b|\buh\b|kind of|sort of|probably|i guess/g)||[]).length;
 const clarity=n<15?.3:n>160?.7:sen>=2?1:.6,conf=Math.max(.2,1-.2*hedge),depth=(/for example|for instance|because|such as|so that|therefore/.test(low)?.5:0)+(n>40?.3:0)+(/\d/.test(low)?.2:0),comm=(/\bi\b(?![\w'])/.test(text)?.4:1)*(n/Math.max(1,sen)<32?1:.7)*(/[.!?]$/.test(text.trim())?1:.8);
 const score=Math.round(100*clamp(.4*rel+.2*clarity+.1*conf+.15*Math.min(1,depth)+.15*Math.min(1,comm),0,1));
 const tips=[];if(n<25)tips.push('Go deeper: aim for 40-100 words with one example.');if(hedge)tips.push('Replace hedges ("maybe", "I think") with direct statements.');if(miss.length&&it.k)tips.push('Cover: '+miss.map(m=>m.split('|')[0]).join(', ')+'.');if(!/for example|for instance|such as/.test(low))tips.push('Add one concrete example.');if(/\bi\b(?![\w'])/.test(text))tips.push('Capitalise "I" and check punctuation.');
 return{score,miss,tips,m:[['Relevance',rel],['Clarity',clarity],['Confidence',conf],['Communication',Math.min(1,comm)],['Depth',Math.min(1,depth)]]}}
function defQs(p){const terms=(p.tech||'').toLowerCase().split(/[^a-z#.]+/).filter(x=>x.length>2).concat((p.name||'').toLowerCase().split(/\W+/).filter(x=>x.length>3),(p.db||'').toLowerCase().split(/\W+/).filter(x=>x.length>3));

solProb:()=>{$('#out').innerHTML=reveal(PROBS.find(p=>p.id===CP))+'<p class="note">Now close it and re-write the solution from memory.</p>'},
manualSolve:()=>{$('#out').innerHTML=finishProb(PROBS.find(p=>p.id===CP))},
markSolved:()=>{const x=$('#expl').value.trim();if(x.split(/\s+/).length<8){toast('Explain it in at least a sentence or two first');return}if(!S.solved[CP]){S.solved[CP]=Date.now();gain(25,'coding');autoDone('coding');toast('+25 XP')}save();CP=null;render()},
aptStart:e=>{const k=e.dataset.k,qs=buildTest(k);AP={stage:'run',qs,i:0,sel:null,ans:[],start:Date.now(),limit:qs.length*72};render()},
aptPick:e=>{AP.sel=+e.dataset.i;render()},
aptNext:()=>{AP.ans[AP.i]=AP.sel;AP.sel=null;if(AP.i>=AP.qs.length-1)aptFinish();else{AP.i++;render()}},
aptQuit:()=>{clearInterval(AP.tm);AP=null;render()},aptDone:()=>{AP=null;render()},
openProj:e=>{PJ=e.dataset.id;render()},closeProj:()=>{PJ=null;render()},
startProj:e=>{S.projects[e.dataset.id]={done:0,t:Date.now()};save();render()},
projHint:e=>{$('#mh').innerHTML=`<p class="sm"><b>Hint:</b> ${e.dataset.h}</p>`},
projDone:e=>{if(!confirm('Did you build this milestone yourself and test it?'))return;const p=S.projects[e.dataset.id];p.done++;gain(30,'project');if(p.done===7)toast('Project complete. Run the quality checker.');else toast('+30 XP');autoDone('project');save();render()},
defend:e=>{ivStart('defense',PROJECTS.find(p=>p.id===e.dataset.id));view='interview';render()},
ghCheck:e=>{S.gh.checks[e.dataset.k]=e.checked;if(e.checked){gain(10,'knowledge');autoDone('github')}save();render()},
portCheck:e=>{S.port[e.dataset.k]=e.checked;save();render()},
ghIn:e=>{S.gh.inputs[e.dataset.k]=Math.max(0,+e.value||0);save()},
qual:e=>{const q=S.quality[e.dataset.p]||{c:{}};q.c[e.dataset.k]=e.checked;q.score=Math.round(Object.values(q.c).filter(Boolean).length/24*100);S.quality[e.dataset.p]=q;save();render()},
rtab:e=>{sub.resume=e.dataset.v;render()},
saveResume:()=>{const a=atsScore(S.resume.data);if(!S.resume.data.attest){toast('Confirm that everything is true first');return}S.resume.ats=a.score;S.resume.saved=true;gain(20,'knowledge');save();toast('Resume saved. ATS '+a.score);render()},
copyResume:async()=>{const t=$('#rprev');try{await navigator.clipboard.writeText(t.value);toast('Copied')}catch(e){t.select();toast('Press copy on the selected text')}},
review:()=>{$('#rvout').innerHTML=review($('#rv').value)},
ivStart:e=>ivStart(e.dataset.m),ivQuit:()=>{IV=null;render()},
ivSubmit:()=>{const t=$('#ans').value.trim();if(t.split(/\s+/).length<3){toast('Write a fuller answer first');return}const it=IV.pool[IV.i],r=evalAns(it,t);
 r.follow=false;if(IV.mode==='tech'&&r.miss.length&&!it.fu&&Math.random()<.7){r.follow=true;IV.next={t:it.t,fu:1,q:`Follow-up: you did not mention "${r.miss[0].split('|')[0]}". How does it fit into your answer on ${it.t}?`,k:[r.miss[0]]}}
 IV.fb=r;IV.n++;IV.sc.push(r.score);const kind=IV.mode==='eng'?'eng':IV.mode;if(IV.mode==='eng'){S.eng.push({score:r.score,t:Date.now()});autoDone('comm')}S.iv.push({kind:IV.mode==='eng'?'hr':IV.mode,topic:it.t,score:r.score,t:Date.now()});if(IV.mode==='defense')S.defense++;gain(8,'interview');render()},
ivNext:()=>{const f=IV.fb;IV.fb=null;if(f.follow&&IV.next){IV.pool.splice(IV.i+1,0,IV.next);IV.next=null}IV.i++;render()},
mic:()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;try{const r=new SR();r.lang='en-IN';r.onresult=e=>{$('#ans').value+=' '+e.results[0][0].transcript};r.start();toast('Listening…')}catch(e){toast('Voice input unavailable. Type your answer.')}},
send:()=>{const i=$('#mq'),t=i.value.trim();if(!t)return;chatLog.push(['u',t],['a',mentorReply(t)]);render()},
ask:e=>{chatLog.push(['u',e.dataset.q],['a',mentorReply(e.dataset.q)]);render()},
jtab:e=>{sub.journey=e.dataset.v;render()},
topic:e=>{S.topics[e.dataset.id]=e.checked;if(e.checked){gain(15,'knowledge');autoDone('tech')}save();render()},
gapTask:e=>{const m=genMission();m.push({id:today()+'g'+m.length,kind:'gap',cat:'knowledge',xp:20,status:0,focus:true,title:`Gap: strengthen ${e.dataset.n}`,detail:'Spend 30 focused minutes on this, then test yourself without notes.',go:({coding:'code',aptitude:'apt',technical:'journey',sqldbms:'journey',projects:'projects',github:'github',resume:'resume',communication:'interview',interview:'interview'})[e.dataset.k]});save();toast('Added to today\'s mission')}};
let render0=false;
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName==='INPUT'||el.tagName==='SELECT')return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.a&&(el.tagName==='INPUT'||el.tagName==='SELECT')){A[el.dataset.a](el)}if(el.dataset.f&&(el.type==='checkbox'||el.tagName==='SELECT')){S.resume.data[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;save();if(el.dataset.f==='version'||el.dataset.f==='attest')render()}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.f&&el.type!=='checkbox'&&el.tagName!=='SELECT'){S.resume.data[el.dataset.f]=el.value;save();const a=atsScore(S.resume.data);$('#atsChip').textContent='ATS '+a.score+'/100';$('#atsBig').textContent=a.score;$('#atsList').innerHTML=a.items.filter(x=>!x.ok&&x.pts).map(x=>`<div class="verdict bad sm">${esc(x.m)} (+${x.pts})</div>`).join('')||'<div class="verdict ok">All checks pass.</div>';$('#rprev').value=resumeText(S.resume.data)}});
document.addEventListener('keydown',e=>{if(e.key==='Tab'&&e.target.id==='code'){e.preventDefault();const t=e.target,s=t.selectionStart;t.setRangeText('  ',s,t.selectionEnd,'end')}if(e.key==='Enter'&&e.target.id==='mq'){A.send()}});
setInterval(()=>{if(S&&S.profile&&!document.hidden){S.mins[today()]=(S.mins[today()]||0)+1;save()}},60000);

/* ============ boot ============ */
load();applyTheme();render();
</script>
</body>
</html>
